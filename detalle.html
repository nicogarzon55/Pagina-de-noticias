<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalle de la noticia · Poli Noticias</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="detalle">
<header class="header">
 <div class="contenedor">
  <div class="header__top">
   <a class="logo" href="index.html">Poli Noticias</a>
   <form class="buscador" role="search" id="form-buscador">
    <label class="sr-only" for="q">Buscar noticias</label>
    <input type="search" id="q" placeholder="Buscar noticias">
    <button class="btn btn--verde" type="submit">Buscar</button>
   </form>
   <div class="edicion" id="fecha-edicion">Edición nacional</div>
  </div>
  <nav class="nav" aria-label="Principal"><a href="index.html">Inicio</a><a href="noticias.html" aria-current="page">Noticias</a><a href="favoritos.html">Favoritos</a><a href="contacto.html">Contacto</a><span class="nav__sep"></span><a class="nav__cat" href="noticias.html?categoria=educación">Educación</a><a class="nav__cat" href="noticias.html?categoria=tecnológica">Tecnológica</a><a class="nav__cat" href="noticias.html?categoria=turismo">Turismo</a><a class="nav__cat" href="noticias.html?categoria=comercio">Comercio</a></nav>
 </div>
</header>
<main class="contenedor">
<article class="detalle" id="detalle">
 <div>
  <p class="categoria" id="d-categoria">Cargando…</p>
  <h1 id="d-titulo">Cargando noticia…</h1>
  <p class="meta" id="d-meta"></p>
  <figure style="margin:1rem 0"><div id="d-imagen"><div class="ph" data-etiqueta="Imagen principal"></div></div><figcaption class="pie-foto" id="d-pie"></figcaption></figure>
  <div class="detalle__cuerpo" id="d-cuerpo"></div>
  <div class="detalle__acciones">
   <button class="btn btn--verde" type="button" id="btn-favorito" aria-pressed="false">♡ Agregar a favoritos</button>
   <a class="btn btn--borde" id="btn-contactar" href="contacto.html">Contactar</a>
  </div>
 </div>
 <aside class="relacionadas" id="relacionadas" aria-label="Noticias relacionadas">
  <h2>Relacionadas</h2>
  <div class="relacionadas__lista" id="relacionadas-lista"></div>
 </aside>
</article>
<p class="vacio" id="detalle-no-encontrada" hidden><span></span> <a class="card__enlace" href="noticias.html">Ver todas las noticias</a></p>
</main>
<footer class="footer">
 <div class="contenedor">
  <div class="footer__fila">
   <div><strong>Poli Noticias</strong><br>© 2026 Politécnico Grancolombiano · Proyecto académico Front-end</div>
   <div>
    <nav aria-label="Pie de página"><a href="index.html">Inicio</a><a href="noticias.html">Noticias</a><a href="favoritos.html">Favoritos</a><a href="contacto.html">Contacto</a></nav>
    <div class="puntos" aria-label="Redes sociales"><i style="background:var(--verde)"></i><i style="background:var(--rojo)"></i><i style="background:var(--tinta)"></i></div>
   </div>
  </div>
 </div>
</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
